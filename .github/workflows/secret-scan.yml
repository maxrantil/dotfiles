# ABOUTME: Gitleaks secret scanning on pushes and PRs to master
name: Secret Scanning

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  secret-scan:
    name: Scan for Secrets
    uses: maxrantil/.github/.github/workflows/secret-scan-reusable.yml@master
    with:
      gitleaks-version: '8.30.1'  # pinned; bump deliberately
      fail-on-error: true
