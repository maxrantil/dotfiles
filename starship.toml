# Starship prompt configuration
command_timeout = 30000

# Clean, informative format
format = """
$username[@](bold green)$hostname in $directory $git_branch$git_status$python
$character"""

# ===================================
# USERNAME & HOSTNAME
# ===================================
[username]
show_always = true
format = "[$user]($style)"
style_user = "bold yellow"
style_root = "bold red"
disabled = false

[hostname]
ssh_only = false
format = "[$hostname](bold green)"
trim_at = "."
disabled = false

# ===================================
# DIRECTORY
# ===================================
[directory]
style = "blue bold"
truncation_length = 3
truncate_to_repo = true
fish_style_pwd_dir_length = 1

# ===================================
# GIT
# ===================================
[git_branch]
symbol = "🌿 "
style = "bold purple"

[git_status]
style = "red bold"
format = '([\[$all_status$ahead_behind\]]($style) )'
conflicted = "CONFLICT"
ahead = "⇡${count}"
staged = "+${count}"
renamed = "R${count}"
deleted = "-${count}"

# ===================================
# PROMPT CHARACTER
# ===================================
[character]
success_symbol = "[➜](bold green)"
error_symbol = "[✗](bold red)"

# ===================================
# LANGUAGES
# ===================================
[python]
disabled = false
format = 'via [🐍 $version]($style) '

[rust]
disabled = true

[nodejs]
disabled = true

[kubernetes]
disabled = true
